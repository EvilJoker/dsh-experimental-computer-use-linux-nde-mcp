# Default Cordis composition for @ashtonsun/dsh-experimental-computer-use-linux-nde-mcp.
#
# Mount the shared computer-use slot first, then register this package as the
# exclusive provider.
#
# The spawned musl binary is fetched on `npm install` via the postinstall hook
# (scripts/install-binary.js) from the GitHub release identified by the
# `binaryTag` field in package.json. To upgrade the binary, bump `binaryTag`
# and republish this npm package; no provider reinstall is required.
- insert:
    - id: computer-use
      name: '@deepseek-ai/dsh-computer-use'
    - id: computer-use-linux-nde-mcp
      name: '@ashtonsun/dsh-experimental-computer-use-linux-nde-mcp'
      config:
        command: ./node_modules/@ashtonsun/dsh-experimental-computer-use-linux-nde-mcp/bin/computer-use-linux-static-claude-nde-x86_64-unknown-linux-musl
        args: [mcp]
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10
        env:
          NDE_AT_SPI_SCOPE_REQUIRED: '1'
